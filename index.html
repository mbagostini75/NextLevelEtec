  .topic-num { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--panel-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px; flex: 0 0 auto; }

    margin: 0; 
    background: #4a9c5c; 
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 16px, rgba(0,0,0,.1) 16px, rgba(0,0,0,.1) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 16px, rgba(0,0,0,.1) 16px, rgba(0,0,0,.1) 32px),

    padding-bottom: env(safe-area-inset-bottom, 0px);

  .topic-body strong { display: block; font-size: 14.5px; }
  .topic-body small { color: var(--text-dim); font-size: 11.5px; }
  .topic-row .chev { color: var(--text-dim); font-size: 16px; }

  .ranked-row { margin-top: 14px; border-top: 3px solid var(--gold); }
  .ranked-row.locked { opacity: .5; }
  .ranked-row .topic-num { background: var(--gold); color: #241a00; border-color: var(--gold); }
  .ranked-row.locked .topic-num { background: var(--panel-2); color: var(--text-dim); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; color: var(--tone); }
  .chunk-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .chunk-list li { font-size: 14.5px; }
  .example-box { margin-top: 12px; background: var(--panel-2); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 13.5px; }
  .example-box span { display: block; font-family: 'Rajdhani', sans-serif; font-size: 10.5px; letter-spacing: .08em; color: var(--tone); font-weight: 700; margin-bottom: 4px; }

  .ghost-toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--border); background: transparent; color: var(--text-dim); border-radius: 999px; padding: 7px 12px; font-size: 12px; margin-top: 12px; }
  .rap-box { margin-top: 10px; border-radius: var(--radius); border: 1px dashed var(--border); background: var(--panel-2); padding: 14px; }

  .primary-btn { width: 100%; margin-top: 16px; border: none; border-radius: var(--radius-sm); background: var(--tone); color: #06070c; font-weight: 700; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; padding: 14px; }
  .primary-btn:disabled { opacity: .4; }
  .ghost-btn { width: 100%; margin-top: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: var(--radius-sm); padding: 12px; font-weight: 600; font-size: 13.5px; }

  .lives-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }

  .qcount { margin-left: auto; font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--text-dim); font-size: 13px; }

  .question-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 8px; }
  .question-card p.prompt { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .option-btn { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 14px; }
  .option-btn .letter { width: 22px; height: 22px; border-radius: 6px; background: var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
  .option-btn.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--panel-2)); }
  .option-btn.correct .letter { background: var(--good); color: #06210f; }

  .option-btn.wrong .letter { background: var(--bad); color: #2c0303; }
  .option-btn:disabled { opacity: .9; }

  .solution-box { margin-top: 12px; border-radius: var(--radius-sm); padding: 13px 14px; font-size: 13.5px; }
  .solution-box.ok { background: color-mix(in srgb, var(--good) 14%, var(--panel)); border: 1px solid var(--good); }
  .solution-box.no { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); border: 1px solid var(--bad); }
  .solution-box strong { display: block; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: .04em; font-size: 12px; margin-bottom: 6px; }
  .solution-box ol { margin: 0; padding-left: 18px; }
  .solution-box li { margin-bottom: 3px; }

  .result-banner { margin-top: 14px; border-radius: var(--radius); padding: 18px; text-align: center; }
  .result-banner.win { background: color-mix(in srgb, var(--good) 16%, var(--panel)); border: 1px solid var(--good); }
  .result-banner.lose { background: color-mix(in srgb, var(--bad) 16%, var(--panel)); border: 1px solid var(--bad); }
  .result-banner h3 { margin: 0 0 4px; font-size: 20px; }
  .result-banner p { margin: 0; font-size: 13px; color: var(--text-dim); font-family: 'Lexend', sans-serif; text-transform: none; }

  .recap-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 8px; font-size: 12.5px; background: var(--panel-2); }
  .recap-item strong { display: block; font-size: 13px; margin-bottom: 3px; }
  .recap-item ol { margin: 6px 0 0; padding-left: 18px; }
  .recap-correct { display: block; color: #3ddc84; font-weight: 600; margin: 2px 0 4px; }
  .round-badge { background: var(--accent, #ff3b5c); color: #10121a; font-weight: 800; font-size: 11px; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; }

  .empty-note { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 26px 10px; }
  .monster-row { display: flex; align-items: center; gap: 12px; width: 100%; border-radius: var(--radius); border: 1px solid var(--border); border-top: 3px solid var(--bad); background: var(--panel); padding: 12px; margin-top: 9px; color: var(--text); text-align: left; }
  .monster-row .info { flex: 1; }
  .monster-row .info strong { display: block; font-size: 13.5px; }
  .monster-row .info small { color: var(--text-dim); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--gold); color: var(--text); padding: 9px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 700; z-index: 50; font-family: 'Rajdhani', sans-serif; letter-spacing: .03em; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }

    function pickFreshIndices(key, poolLength, count) {
      var used = state.usedIdx[key] || [];
      var all = []; for (var i = 0; i < poolLength; i++) all.push(i);
      var avail = all.filter(function (i) { return used.indexOf(i) === -1; });
      var chosen;
      if (avail.length >= count) {
        chosen = shuffle(avail).slice(0, count);
      } else {
        chosen = avail.slice();
        var freshPool = shuffle(all.filter(function (i) { return chosen.indexOf(i) === -1; }));
        chosen = chosen.concat(freshPool.slice(0, count - chosen.length));
        used = [];
      }
      state.usedIdx[key] = used.concat(chosen);
      if (state.usedIdx[key].length >= poolLength) state.usedIdx[key] = [];
      saveState();
      return chosen;
    }

    function shuffleOptions(q) {
      var opts = q.options.map(function (opt, idx) { return { opt: opt, orig: idx }; });
      opts = shuffle(opts);
      return {
        prompt: q.prompt,
        sourceKey: JSON.stringify([q.prompt,q.options]),
        solution: q.solution,
        options: opts.map(function (o) { return o.opt; }),
        answer: opts.findIndex(function (o) { return o.orig === q.answer; })
      };
    }

    function buildDuel(pool, count, keyForFreshness) {
      var idxs = keyForFreshness ? pickFreshIndices(keyForFreshness, pool.length, count) : shuffle(pool.map(function (_, i) { return i; })).slice(0, count);
      return idxs.map(function (i) { return shuffleOptions(pool[i]); });
    }

    function startTopicDuel(subjectId, topicId) {
      if(!topicUnlocked(subjectId,topicId)){toast("Domine o tópico anterior com 10 acertos para avançar.");return;}
      var topic = findTopic(subjectId, topicId);
      var key = topicKey(subjectId, topicId);
      var questions = buildDuel(topic.pool, Math.min(DUEL_SIZE, topic.pool.length), key);
      duel = { subjectId: subjectId, topicId: topicId, isRanked: false, questions: questions, index: 0, round: 1, correctCount: 0, wrongThisRound: [], phase: "asking" };
      view = { name: "duel" };

    function startNextRound() {
      if(!duel||duel.phase!=="roundResult")return;
      var topic = findTopic(duel.subjectId, duel.topicId);
      var key = topicKey(duel.subjectId, duel.topicId);
      var previous = duel.questions.map(function(q){return q.sourceKey;});
      var available = topic.pool.filter(function(q){return previous.indexOf(JSON.stringify([q.prompt,q.options])) === -1;});
      if (available.length < DUEL_SIZE) { toast("Banco insuficiente para 12 perguntas diferentes."); return; }
      duel.questions = shuffle(available).slice(0, DUEL_SIZE).map(shuffleOptions);
      duel.correctCount = 0;
      duel.index = 0;
      duel.selected = null;
      duel.wrongThisRound = [];
      duel.round = (duel.round || 1) + 1;
      duel.phase = "asking";
      render(); window.scrollTo(0, 0);
    }

    function startRankedDuel(subjectId) {
      var subject = findSubject(subjectId);
      if(!subject||!subjectFullyDone(subject)){toast("Domine os tópicos para liberar a ranqueada.");return;}
      var pool = [];
      subject.topics.forEach(function (t) { pool = pool.concat(t.pool); });
      var questions = shuffle(pool).slice(0, 15).map(shuffleOptions);
      duel = { subjectId: subjectId, topicId: null, isRanked: true, isRevanche: false, questions: questions, index: 0, lives: LIVES_MAX, correctCount: 0, wrongPrompts: [], phase: "asking" };
      view = { name: "duel" };
      render(); window.scrollTo(0, 0);
    }

    function answerQuestion(optIndex) {
      if (!duel || duel.phase !== "asking") return;
      if(!duel || !Number.isInteger(optIndex)) return;
      var q = duel.questions[duel.index];
      if(optIndex<0||optIndex>=q.options.length)return;
      duel.selected = optIndex;
      var correct = optIndex === q.answer;
      if (correct) { duel.correctCount++; if(!state.solvedKeys) state.solvedKeys={}; var solvedKey=duel.subjectId+"|"+q.sourceKey; if(!state.solvedKeys[solvedKey]){state.solvedKeys[solvedKey]=true;state.xp+=10;} }
      else if (duel.isRanked) { duel.lives--; duel.wrongPrompts.push(q.prompt); }
      else { duel.wrongThisRound.push(q); }
      saveState();
      duel.phase = "feedback";
      render();
    }

    function nextQuestion() {
      if(!duel||duel.phase!=="feedback")return;
      if (duel.isRanked) {
        if (duel.lives <= 0) {
          duel.phase = "defeat";
          applyDuelEnd(false);
        } else if (duel.index === duel.questions.length - 1) {
          duel.phase = "victory";
          applyDuelEnd(true);
        } else {
          duel.index++;
          duel.phase = "asking";
          duel.selected = null;
        }
      } else {
        if (duel.index === duel.questions.length - 1) {
          if (duel.correctCount >= PASS_SCORE) {
            duel.phase = "victory";
            applyDuelEnd(true);

            var pendingKey=topicKey(duel.subjectId,duel.topicId);
            state.wrongLog[pendingKey]=Array.from(new Set((state.wrongLog[pendingKey]||[]).concat(duel.wrongThisRound.map(function(q){return q.prompt;}))));

          duel.selected = null;
        }
      }

      html += '<button class="chefao-banner challenge-card '+(arenaDone?'':'locked')+'" '+(arenaDone?'onclick="NextModules.startBoss(false)"':'disabled')+'><span class="crown">⚡</span><span class="txt"><span class="eyebrow">DESAFIO COMPLETO</span><h2>Desafio Final <small>(Você na Etec!)</small></h2><p>'+(arenaDone?'180 questões autorais, sete matérias e resoluções ao finalizar.':'Conquiste nota acima de 85% em uma prova da Arena ETEC para liberar. Você pode refazer a prova quantas vezes precisar.')+'</p></span><span class="arrow">'+(arenaDone?'›':'🔒')+'</span></button>';
      html += '<p class="theme-card-note">12 perguntas por rodada · avance com 10 acertos.</p>';
      if (monsterCount > 0) html += '<button class="den-btn" onclick="RotaGame.go({name:\'den\'})">⚠ Pendências pra revisar <span class="count">' + monsterCount + '</span></button>';
      return html;
    }

    function renderOfficial(){return window.NextModules.renderOfficial(view.examId);}
    function renderSubject(subjectId) {
      var subject = findSubject(subjectId);
      var html = '';
      html += '<div class="screen-header"><button class="back-btn" onclick="RotaGame.go({name:\'home\'})">‹</button><div><h2>' + subject.name + '</h2><small>' + subject.tag + '</small></div></div>';
      html += '<p class="module-intro">Os materiais existentes estão liberados para estudar. Abra um tópico para ver o resumo, a videoaula, a leitura e os exercícios. Os duelos avançam por etapas.</p>';
      subject.topics.forEach(function (t, idx) {
        var done = isTopicDone(subject.id, t.id);
        var unlocked = topicUnlocked(subject.id,t.id);
        html += (
          '<button class="topic-row ' + (done ? "done" : "") + '" onclick="RotaGame.go({name:\'topic\',subjectId:\'' + subject.id + '\',topicId:\'' + t.id + '\'})">' +
            '<div class="topic-num">' + (done ? "✔" : (idx + 1)) + '</div>' +
            '<div class="topic-body"><strong>' + t.title + '</strong><small>' + ('Resumo, videoaula e exercícios · ' + t.pool.length + ' perguntas' + (!unlocked ? ' · duelo libera após o anterior' : '')) + '</small></div>' +
            '<div class="chev">›</div>' +
          '</button>'
        );
      });
      var full = subjectFullyDone(subject);
      var rankedDone = !!state.rankedCleared[subject.id];
      html += (
        '<button class="topic-row ranked-row ' + (full ? "" : "locked") + '" ' + (full ? ('onclick="RotaGame.startRanked(\'' + subject.id + '\')"') : '') + '>' +
          '<div class="topic-num">' + (rankedDone ? "🏆" : "★") + '</div>' +
          '<div class="topic-body"><strong>Prova Ranqueada</strong><small>' + (full ? (rankedDone ? "Vencida — pode repetir pra treinar" : "15 perguntas, misturando todos os tópicos") : "Domine todos os tópicos pra liberar") + '</small></div>' +
          '<div class="chev">' + (full ? "›" : "🔒") + '</div>' +
        '</button>'
      );
      return html;
    }

    function renderTopic(subjectId, topicId) {
      var subject = findSubject(subjectId);
      var t = findTopic(subjectId, topicId);
      var done = isTopicDone(subjectId, topicId);
      var html = '';
      html += '<div class="screen-header"><button class="back-btn" onclick="RotaGame.go({name:\'subject\',subjectId:\'' + subjectId + '\'})">‹</button><h2>' + t.title + '</h2></div>';
      html += window.NextModules.renderStudyStart(subject.name, topicId);
      html += '<div class="card" style="--tone:' + subject.toneHex + '"><h3>Resumo do tópico</h3><ul class="chunk-list">' + t.explain.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>';
      html += '<div class="example-box"><span>Exemplo</span>' + esc(t.example) + '</div>';
      html += window.NextModules.renderStudyLinks(subject.name, topicId);
      html += '</div>';
      html += window.ReadingCheck.button(subjectId, topicId);
      html += topicUnlocked(subjectId, topicId) ? '<button class="primary-btn" style="--tone:' + subject.toneHex + '" onclick="RotaGame.startTopic(\'' + subjectId + '\',\'' + topicId + '\')">' + (done ? "Duelar de novo" : "Iniciar duelo · " + Math.min(DUEL_SIZE, t.pool.length) + " perguntas · avance com 10 acertos") + '</button>' : '<div class="card duel-locked"><strong>Estude agora. O duelo vem depois.</strong><p>Acerte 10 de 12 no tópico anterior para liberar este duelo. O resumo, os links e a checagem de leitura já estão disponíveis.</p></div>';
      return html;
    }

    function renderLives() {
      var pips = '';
      for (var i = 0; i < LIVES_MAX; i++) pips += '<span class="life ' + (i < duel.lives ? "" : "lost") + '"></span>';
      return '<div class="lives-row"><div class="lives">' + pips + '</div><div class="qcount">' + (duel.index + 1) + ' / ' + duel.questions.length + '</div></div>';
    }
    function renderProgress() {
      if (duel.isRanked) return renderLives();
      var roundBadge = duel.round > 1 ? '<span class="round-badge">Rodada ' + duel.round + '</span>' : '';
      return '<div class="lives-row">' + roundBadge + '<div class="qcount">' + (duel.index + 1) + ' / ' + duel.questions.length + '</div></div>';
    }

    function renderDuel() {
      var subject = findSubject(duel.subjectId);
      var title = duel.isRanked ? "Ranqueada · " + subject.name : findTopic(duel.subjectId, duel.topicId).title;
      var backOnclick = duel.isRanked
        ? ("RotaGame.go({name:'subject',subjectId:'" + duel.subjectId + "'})")
        : ("RotaGame.go({name:'topic',subjectId:'" + duel.subjectId + "',topicId:'" + duel.topicId + "'})");
      var html = '';
      html += '<div class="screen-header"><button class="back-btn" onclick="' + backOnclick + '">‹</button><h2>' + title + '</h2></div>';

      if (duel.phase === "roundResult") {
        var n = duel.wrongThisRound.length;
        html += '<div class="result-banner lose"><h3>Mais uma rodada</h3><p>Errou ' + n + ' pergunta' + (n > 1 ? "s" : "") + '. São necessários 10 acertos de 12. Revise antes de continuar:</p></div>';
        html += '<div class="card"><h3>Pra revisar</h3>';
        duel.wrongThisRound.forEach(function (q) {
          html += '<div class="recap-item"><strong>' + esc(q.prompt) + '</strong><span class="recap-correct">Resposta certa: ' + esc(q.options[q.answer]) + '</span>' + (q.solution ? '<ol>' + q.solution.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' : '') + '</div>';
        });
        html += '</div>';
        html += '<button class="primary-btn" style="--tone:' + subject.toneHex + '" onclick="RotaGame.nextRound()">Nova rodada · 12 perguntas diferentes</button>';
        return html;
      }

      if (duel.phase === "victory" || duel.phase === "defeat") {
        var passed = duel.phase === "victory";
        var title = passed ? (duel.isRanked ? "Vitória!" : "Tópico dominado!") : "Você perdeu todas as vidas";
        var sub = duel.isRanked
          ? (duel.correctCount + ' de ' + duel.questions.length + ' certas' + (passed ? " · desafio dominado" : ""))
          : (passed ? (duel.correctCount + " de 12 acertos" + (duel.round > 1 ? " (depois de " + duel.round + " rodadas)" : "") + " · tópico dominado") : "");
        html += '<div class="result-banner ' + (passed ? "win" : "lose") + '"><h3>' + title + '</h3><p>' + sub + '</p></div>';
        if (duel.isRanked && duel.wrongPrompts.length > 0) {
          html += '<div class="card"><h3>Pra revisar</h3>';
          duel.questions.forEach(function (q) {
            if (duel.wrongPrompts.indexOf(q.prompt) !== -1) {
              html += '<div class="recap-item"><strong>' + esc(q.prompt) + '</strong>' + (q.solution ? q.solution.map(function (s) { return esc(s); }).join(' · ') : '') + '</div>';
            }
          });
          html += '</div>';
        }
        if (passed) html += '<button class="primary-btn" style="--tone:' + subject.toneHex + '" onclick="' + backOnclick + '">Continuar</button>';
        else {
          html += '<button class="primary-btn" style="--tone:' + subject.toneHex + '" onclick="RotaGame.retryDuel()">Tentar de novo (perguntas novas)</button>';
          html += '<button class="ghost-btn" onclick="' + backOnclick + '">Voltar e estudar antes</button>';
        }
        return html;
      }

      html += renderProgress();
      var q = duel.questions[duel.index];
      html += '<div class="question-card"><p class="prompt">' + esc(q.prompt) + '</p><div class="options">';
      q.options.forEach(function (opt, oi) {
        var cls = "option-btn";
        var disabled = duel.phase === "feedback";
        if (disabled) {
          if (oi === q.answer) cls += " correct";
          else if (oi === duel.selected) cls += " wrong";
        }
        html += '<button class="' + cls + '" ' + (disabled ? "disabled" : 'onclick="RotaGame.answer(' + oi + ')"') + '><span class="letter">' + String.fromCharCode(65 + oi) + '</span>' + esc(opt) + '</button>';
      });
      html += '</div>';
      if (duel.phase === "feedback") {
        var ok = duel.selected === q.answer;
        html += '<div class="solution-box ' + (ok ? "ok" : "no") + '"><strong>' + (ok ? "Certo — como resolve:" : "Errou — como resolve:") + '</strong><ol>' + (q.solution || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol><a href="https://drive.google.com/file/d/1zvz3NLCsSmid_rC-3qn1efbcdiBLoDI1/view?usp=drivesdk" target="_blank" rel="noopener">Registro da explicação ↗</a></div>';
        var isLastStep = duel.lives <= 0 || duel.index === duel.questions.length - 1;
        html += '<button class="primary-btn" style="--tone:' + subject.toneHex + '" onclick="RotaGame.nextQuestion()">' + (isLastStep ? "Ver resultado" : "Próxima pergunta") + '</button>';
      }
      html += '</div>';
      return html;
    }

    function renderDen() {
      var html = '';
      html += '<div class="screen-header"><button class="back-btn" onclick="RotaGame.go({name:\'home\'})">‹</button><h2>Pendências</h2></div>';
      var rows = [];
      SUBJECTS.forEach(function (subject) {
        subject.topics.forEach(function (t) {
          var key = topicKey(subject.id, t.id);
          var wrong = state.wrongLog[key] || [];
          if (wrong.length > 0) rows.push({ subject: subject, topic: t, count: wrong.length });
        });
      });
      if (rows.length === 0) html += '<p class="empty-note">Nada pendente. Quando você perder um duelo, o tópico aparece aqui pra revanche.</p>';
      else rows.forEach(function (r) {
        html += (
          '<button class="monster-row" onclick="RotaGame.startRevanche(\'' + r.subject.id + '\',\'' + r.topic.id + '\')">' +
            '<span class="info"><strong>' + r.topic.title + '</strong><small>' + r.count + ' pergunta' + (r.count > 1 ? "s" : "") + ' pra revisar</small></span>' +
            '<span class="chev">›</span>' +
          '</button>'
        );
      });
      return html;
    }

    function render() {
      state.theme="base";state.mode="jogo";document.documentElement.setAttribute("data-mode", "jogo");
      document.documentElement.setAttribute("data-theme", "base");
      var app = document.getElementById("app");
      var body = "";
      if (view.name === "home") body = renderHome();
      else if (view.name === "subject") body = window.NextCurriculum.renderSubject(view.subjectId);
      else if (view.name === "curriculumTopic") body = window.NextCurriculum.renderTopic(view.subjectId, view.topicId);
      else if (view.name === "topic") body = renderTopic(view.subjectId, view.topicId);
      else if (view.name === "duel") body = renderDuel();
      else if (view.name === "den") body = renderDen();
      else if (view.name === "official") body = renderOfficial();
      else if (view.name === "readingCheck") body = window.ReadingCheck.render();
      else if (view.name === "boss") body = window.NextModules.renderBoss();
      else if(window.NextAccounts)body=window.NextAccounts.render(view);
      if(view.name==="duel" && duel && duel.onlinePending)body+='<button class="primary-btn" onclick="NextAccounts.retrySync()">Sincronizar rodada</button>';

      app.innerHTML = renderTopbar() + body + '<p id="storage-warning" '+(storageAvailable?'hidden':'')+' role="status">O navegador bloqueou o salvamento. Mantenha a página aberta para preservar esta sessão.</p>';
    }

    window.NEXT_ENGINE = { subjects: SUBJECTS, state:function(){return state;}, view:function(){return view;}, duel:function(){return duel;}, save:saveState, go:go, render:render, installOnlineDuel:function(s,t,ranked,questions){duelEndApplied=false;duel={subjectId:s,topicId:t,isRanked:ranked,questions:questions,index:0,round:1,correctCount:0,wrongThisRound:[],wrongPrompts:[],lives:LIVES_MAX,phase:"asking"};view={name:"duel"};render();window.scrollTo(0,0);} };
    window.RotaGame = {
      go: go,
      setTheme: function(t){state.theme="base";saveState();render();},
      startTopic: function (subjectId, topicId) { duelEndApplied = false; startTopicDuel(subjectId, topicId, false); },
      startRevanche: function (subjectId, topicId) { duelEndApplied = false; startTopicDuel(subjectId, topicId); },
      startRanked: function (subjectId) { duelEndApplied = false; startRankedDuel(subjectId); },
      answer: answerQuestion,
      nextQuestion: nextQuestion,
      nextRound: startNextRound,
      retryDuel: retryDuel,
      speakExplain: function (subjectId, topicId) { var t = findTopic(subjectId, topicId); if (t) speak(t.explain.join(". ") + ". Exemplo: " + t.example); },
      speakRap: function (subjectId, topicId) { var t = findTopic(subjectId, topicId); if (t) speak(t.rap.join(", ")); },
      toggleBeat: toggleBeat,
      toggleReadingMode: toggleReadingMode,
      toggleRap: toggleRap,
    };

    render();
  })();
  </script>

<script src="assets/accounts.js"></script>
<script src="assets/context-help.js"></script>
</body>
</html>
